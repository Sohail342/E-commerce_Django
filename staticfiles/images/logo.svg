<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 60" width="100%" height="100%">
  <style>
    .logo-text { font-family: 'Arial', sans-serif; font-weight: bold; }
    .icon { fill: none; stroke: #8A2BE2; }
    @media (prefers-color-scheme: dark) {
      .logo-text { fill: #ffffff; }
      .icon { stroke: #9d4edd; }
    }
    @media (prefers-color-scheme: light) {
      .logo-text { fill: #333333; }
      .icon { stroke: #8A2BE2; }
    }
  </style>
  
  <!-- Jewelry Icon -->
  <g class="icon" stroke-width="2.5" stroke-linecap="round">
    <path d="M20 30 L35 15 L50 30 L35 45 Z"/>
    <circle cx="35" cy="30" r="5"/>
    <path d="M28 23 L42 37"/>
    <path d="M42 23 L28 37"/>
  </g>
  
  <!-- Zevaristan Text -->
  <text x="60" y="38" class="logo-text" font-size="36" letter-spacing="1">ZEVARISTAN</text>
</svg>