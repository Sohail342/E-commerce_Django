<!-- Mobile Search Overlay -->
<div 
  class="fixed inset-0 z-[9999] bg-white overflow-y-auto transition-all duration-300 transform"
  style="display: none;"
>
  <!-- Search Header with Improved UI -->
  <div class="sticky top-0 bg-white shadow-sm z-10 px-4 py-3 flex items-center justify-between">
    <h2 class="text-xl font-semibold text-gray-900 flex items-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-primary-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
      Search Products
    </h2>
    <button 
      class="p-2 rounded-full text-gray-500 hover:text-gray-700 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-primary-500 transition-all duration-200"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>
  
  <div class="p-4">
    <!-- Enhanced Search Input -->
    <div class="relative mb-6">
      <div class="flex items-center bg-gray-50 rounded-lg border border-gray-300 focus-within:ring-2 focus-within:ring-primary-500 focus-within:border-primary-500 transition-all duration-200 overflow-hidden shadow-sm">
        <div class="pl-3 flex items-center pointer-events-none">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>
        <input 
          type="text" 
          placeholder="Search products..."
          class="w-full pl-2 pr-10 py-3 bg-transparent border-none focus:outline-none text-base"
        >
        <div class="absolute right-3 flex items-center space-x-1">
          <div class="animate-spin h-5 w-5 text-primary-500" style="display: none;">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
          </div>
          <button 
            data-clear-search
            class="text-gray-400 hover:text-gray-600 focus:outline-none p-1 rounded-full hover:bg-gray-200 transition-colors duration-200"
            style="display: none;"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      </div>
    </div>
    
    <!-- Improved Search Results -->
    <div class="space-y-4">
      <!-- Results Header with Better Styling -->
      <div class="flex items-center justify-between mb-4 bg-gray-50 p-3 rounded-lg shadow-sm">
        <h3 class="text-sm font-medium text-gray-700">Found <span class="font-bold text-primary-600 text-lg"></span> products</h3>
        <a href="#" data-clear-search class="text-sm text-primary-600 hover:text-primary-800 font-medium transition-colors duration-200 flex items-center gap-1">
          <span>Clear</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </a>
      </div>
      
      <!-- Enhanced Results Grid with Animation Preparation -->
      <div class="grid grid-cols-1 gap-4">
        <!-- Search results will be dynamically inserted here by JavaScript -->
      </div>
      
      <!-- Improved View All Results Link -->
      <div class="mt-6 pt-4 border-t border-gray-100 text-center">
        <a href="/shop/search/" 
           class="inline-flex items-center justify-center w-full py-3 px-4 bg-primary-50 hover:bg-primary-100 text-primary-700 rounded-lg text-sm font-medium transition-all duration-200 group shadow-sm">
          <span>View all results</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-1 transform group-hover:translate-x-1 transition-transform duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </a>
      </div>
    </div>
  </div>
</div>
