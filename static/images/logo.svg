<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 60" width="100%" height="100%">
  <style>
    .logo-text { font-family: 'Arial', sans-serif; font-weight: bold; }
    .icon { fill: none; stroke: #8A2BE2; }
    @media (prefers-color-scheme: dark) {
      .logo-text { fill: #ffffff; }
      .icon { stroke: #9d4edd; }
    }
    @media (prefers-color-scheme: light) {
      .logo-text { fill: #333333; }
      .icon { stroke: #8A2BE2; }
    }
  </style>
  
  <!-- Elegant Fashion Icon -->
  <g class="icon" stroke-width="2.5" stroke-linecap="round">
    <path d="M25 15 C35 5, 45 15, 45 25 C45 35, 35 45, 25 35 C15 25, 25 15, 25 15"/>
    <path d="M35 20 L35 40"/>
    <circle cx="35" cy="42" r="2"/>
  </g>
  
  <!-- Pehnava Text -->
  <text x="60" y="38" class="logo-text" font-size="36" letter-spacing="1">PEHNAVA</text>
</svg>