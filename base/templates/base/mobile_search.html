<!-- Mobile Search Overlay -->
<div 
  x-data="{
    get isOpen() { return $store.navbarSearch.mobileSearchOpen },
    get query() { return $store.navbarSearch.query },
    set query(value) { $store.navbarSearch.query = value },
    get results() { return $store.navbarSearch.results },
    get isSearching() { return $store.navbarSearch.isSearching }
  }"
  x-show="isOpen"
  x-transition:enter="transition-opacity ease-linear duration-300"
  x-transition:enter-start="opacity-0"
  x-transition:enter-end="opacity-100"
  x-transition:leave="transition-opacity ease-linear duration-300"
  x-transition:leave-start="opacity-100"
  x-transition:leave-end="opacity-0"
  class="fixed inset-0 z-[9999] bg-white p-4 overflow-y-auto"
  style="display: none;"
>
  <!-- Search Header -->
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-lg font-semibold text-gray-900">Search Products</h2>
    <button 
      @click="$store.navbarSearch.toggleMobileSearch()"
      class="p-2 rounded-md text-gray-500 hover:text-gray-700 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-primary-500"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>
  
  <!-- Search Input -->
  <div class="relative mb-6">
    <input 
      type="text" 
      x-model="query" 
      @input="$store.navbarSearch.search()"
      placeholder="Search products..."
      class="w-full pl-10 pr-10 py-3 border border-gray-300 rounded-lg text-base focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all duration-200"
    >
    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
    </div>
    <div x-show="isSearching" class="absolute inset-y-0 right-0 pr-3 flex items-center">
      <svg class="animate-spin h-5 w-5 text-primary-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
    </div>
    <button 
      x-show="query.length > 0" 
      @click="$store.navbarSearch.clearSearch()" 
      class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none"
      style="display: none;"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>
  
  <!-- Search Results -->
  <div class="space-y-3">
    <!-- Search Status -->
    <div class="flex items-center justify-between mb-4" x-show="query.length > 1 && results.length > 0">
      <h3 class="text-sm font-medium text-gray-700">Found <span class="font-bold text-primary-600" x-text="results.length"></span> products</h3>
      <span class="text-xs text-gray-500">Tap on a product to view details</span>
    </div>
    
    <!-- No Results Message -->
    <template x-if="query.length > 1 && results.length === 0 && !isSearching">
      <div class="text-center py-8 bg-gray-50 rounded-lg border border-gray-200">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto text-gray-400 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <p class="text-gray-500 font-medium">No products found</p>
        <p class="text-gray-400 text-sm mt-1">Try a different search term</p>
      </div>
    </template>
    
    <!-- Results List -->
    <div class="grid grid-cols-1 gap-3" x-show="results.length > 0">
      <template x-for="(product, index) in results" :key="product.id">
        <a :href="product.url" class="block p-4 bg-white hover:bg-gray-50 rounded-lg border border-gray-200 transition-all duration-200 flex items-center space-x-4 shadow-sm hover:shadow-md">
          <div class="flex-shrink-0 h-20 w-20 bg-gray-100 rounded-md overflow-hidden border border-gray-200">
            <img :src="product.image" :alt="product.name" class="h-full w-full object-cover">
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-base font-medium text-gray-900 line-clamp-2" x-text="product.name"></p>
            <div class="flex items-center mt-2">
              <template x-if="product.on_sale">
                <div class="flex items-center space-x-2">
                  <span class="text-base font-bold text-primary-600" x-text="'$' + product.price"></span>
                  <span class="text-xs font-semibold text-white bg-red-500 px-1.5 py-0.5 rounded-full" x-text="product.sale_percentage + '%'"></span>
                </div>
              </template>
              <template x-if="!product.on_sale">
                <span class="text-base font-bold text-primary-600" x-text="'$' + product.price"></span>
              </template>
            </div>
          </div>
          <div class="flex-shrink-0 ml-2">
            <div class="bg-primary-50 p-2 rounded-full">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-primary-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
              </svg>
            </div>
          </div>
        </a>
      </template>
    </div>
  </div>
</div>
