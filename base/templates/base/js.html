{% load static %}
<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script defer src="https://unpkg.com/@alpinejs/intersect@3.x.x/dist/cdn.min.js"></script>

<!-- Custom JS -->
<script src="{% static 'js/main.js' %}"></script>
<script src="{% static 'js/ajax-cart.js' %}"></script>
<script src="{% static 'js/side-cart-interactions.js' %}"></script>

<!-- Alpine.js loader initialization is now in base.html -->

<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Intersection Observer for animations
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('show');
          observer.unobserve(entry.target);
        }
      });
    }, {
      threshold: 0.1,
      rootMargin: '0px 0px -100px 0px'
    });

    document.querySelectorAll('[x-intersect]').forEach((el) => observer.observe(el));
  });
</script>
