<!-- Product Detail Mobile Navigation - Only visible on small screens and only on product detail pages -->
<div class="sm:hidden fixed bottom-0 left-0 right-0 z-50 bg-white border-t border-gray-200 shadow-lg backdrop-blur-md bg-opacity-95">
  <div class="flex items-center justify-between px-4 py-3">
    <!-- Buy Now Button -->
    <a href="{% url 'cart:buy_now' product.id 1 %}" id="mobile-buy-now" class="flex items-center justify-center px-4 py-3 text-base font-semibold text-white bg-gradient-to-r from-green-600 to-green-700 hover:from-green-700 hover:to-green-800 rounded-lg shadow-lg hover:shadow-xl transition-all duration-300 group relative overflow-hidden">
      <span class="absolute inset-0 bg-gradient-to-r from-white/20 to-transparent group-hover:scale-x-100 scale-x-0 origin-left transition-transform duration-500"></span>
      <svg class="-ml-1 mr-2 h-5 w-5 transition-transform duration-300 group-hover:rotate-12 group-hover:scale-110" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
      </svg>
      <span class="relative">Buy Now</span>
    </a>
    
    <!-- Add to Cart Button -->
    <button id="mobile-add-to-cart" class="flex-1 ml-3 inline-flex justify-center items-center px-4 py-3 text-base font-semibold text-white bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 rounded-lg shadow-lg hover:shadow-xl transition-all duration-300 group relative overflow-hidden" data-product-id="{{ product.id }}">
      <span class="absolute inset-0 bg-gradient-to-r from-white/20 to-transparent group-hover:scale-x-100 scale-x-0 origin-left transition-transform duration-500"></span>
      <svg class="-ml-1 mr-2 h-5 w-5 transition-transform duration-300 group-hover:rotate-12 group-hover:scale-110" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7A4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
      </svg>
      <span class="relative">Add to Cart</span>
      <span class="absolute inset-0 flex items-center justify-center bg-blue-700 opacity-0 transition-opacity duration-300" id="mobile-loading-state">
        <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
      </span>
    </button>
  </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
      // Get the mobile buttons
      const mobileAddToCartButton = document.getElementById('mobile-add-to-cart');
      const mobileBuyNowButton = document.getElementById('mobile-buy-now');
      const desktopQuantityInput = document.getElementById('quantity');
      
      // Update Buy Now button href with current quantity when quantity changes
      if (mobileBuyNowButton && desktopQuantityInput) {
        // Initial setup of the href with the current quantity
        const updateBuyNowHref = () => {
          const productId = mobileAddToCartButton.dataset.productId;
          const quantity = parseInt(desktopQuantityInput.value) || 1;
          mobileBuyNowButton.href = `/cart/buy-now/product/${productId}/quantity/${quantity}/`;
        };
        
        // Update href when quantity changes
        desktopQuantityInput.addEventListener('change', updateBuyNowHref);
        
        // Also listen for custom events that might be triggered when quantity changes via buttons
        document.addEventListener('quantityChanged', updateBuyNowHref);
        
        // Initial setup
        updateBuyNowHref();
      }
      
      // Add event listener to the mobile add to cart button
      if (mobileAddToCartButton) {
        mobileAddToCartButton.addEventListener('click', function() {
          // Get the product ID from the data attribute
          const productId = mobileAddToCartButton.dataset.productId;
          // Get the quantity from the desktop input (default to 1 if not available)
          const quantity = desktopQuantityInput ? parseInt(desktopQuantityInput.value) : 1;
          
          // Show loading state
          const originalContent = mobileAddToCartButton.innerHTML;
          document.getElementById('mobile-loading-state').classList.remove('opacity-0');
          document.getElementById('mobile-loading-state').classList.add('opacity-100');
          mobileAddToCartButton.disabled = true;
          
          // Add product to cart
          if (productId && !isNaN(parseInt(productId)) && typeof addProductToCart === 'function') {
            addProductToCart(productId, quantity)
              .then(response => {
                if (response.success) {
                  // Update cart count
                  if (typeof updateCartCount === 'function') {
                    updateCartCount();
                  }
                  
                  // User is explicitly adding to cart, so clear the explicit close flag
                  sessionStorage.removeItem('cartExplicitlyClosed');
                  
                  // Fetch and update side cart contents
                  if (typeof fetchCartContents === 'function') {
                    fetchCartContents().then(() => {
                      // Open side cart
                      if (typeof openSideCart === 'function') {
                        openSideCart();
                      }
                      
                      // Reset button state with success indicator
                      document.getElementById('mobile-loading-state').classList.add('opacity-0');
                      document.getElementById('mobile-loading-state').classList.remove('opacity-100');
                      mobileAddToCartButton.disabled = false;
                    });
                  }
                } else {
                  // Show error
                  if (window.showToast) {
                    window.showToast(`<div class="flex items-center"><svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg><span>Failed to add product to cart</span></div>`, 'error');
                  }
                  
                  // Reset button
                  document.getElementById('mobile-loading-state').classList.add('opacity-0');
                  document.getElementById('mobile-loading-state').classList.remove('opacity-100');
                  mobileAddToCartButton.disabled = false;
                }
              })
              .catch(error => {
                // Show error message
                if (window.showToast) {
                  window.showToast(`<div class="flex items-center"><svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg><span>Error adding product to cart</span></div>`, 'error');
                }
                
                // Reset button
                document.getElementById('mobile-loading-state').classList.add('opacity-0');
                document.getElementById('mobile-loading-state').classList.remove('opacity-100');
                mobileAddToCartButton.disabled = false;
              });
          }
        });
      }
      
      // No quantity buttons in mobile view anymore, just Buy Now and Add to Cart buttons
    });
    </script>
