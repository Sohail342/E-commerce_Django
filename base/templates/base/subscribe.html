<section class="bg-primary-50 py-16">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="relative">
      <div class="lg:grid lg:grid-cols-2 lg:gap-8 items-center">
        <div class="text-center lg:text-left md:max-w-2xl md:mx-auto lg:mx-0">
          <h2 class="text-3xl font-extrabold text-gray-900 sm:text-4xl">
            Subscribe to our Newsletter
          </h2>
          <p class="mt-3 text-lg text-gray-500">
            Get email updates about our latest shops and special offers
          </p>
        </div>
        <div class="mt-8 lg:mt-0">
          <form id="subscribe-form" class="sm:flex" method="POST" action="{% url 'base:subscribe' %}">
            {% csrf_token %}
            <div class="min-w-0 flex-1">
              <label for="email" class="sr-only">Email address</label>
              <input type="email" name="email" id="email" class="block w-full px-4 py-3 text-base text-gray-900 placeholder-gray-500 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500" placeholder="Enter your email" required>
            </div>
            <div class="mt-3 sm:mt-0 sm:ml-3">
              <button type="submit" class="block w-full px-4 py-3 font-medium text-white bg-gradient-to-r from-blue-600 to-indigo-700 rounded-md shadow-lg hover:from-blue-700 hover:to-indigo-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:px-10 transition-all duration-300 ease-in-out transform hover:scale-105 hover:shadow-2xl">
                Subscribe
              </button>
            </div>
          </form>
          <p class="mt-3 text-sm text-gray-500 text-center lg:text-left">
            We care about your data. Read our
            <a href="{% url 'about:other-details' %}" class="font-medium text-primary-600 hover:text-primary-500">Privacy Policy</a>.
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
