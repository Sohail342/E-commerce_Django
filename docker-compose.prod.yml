version: '3.8'

services:
  web:
    build:
      context: .
      target: production
    restart: always
    env_file:
      - .env
    environment:
      - MODULE_ENVIRONMENT=PRODUCTION
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - 8000
    depends_on:
      - db
      
  nginx:
    build: ./nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web

  # Uncomment this section if you want to run PostgreSQL in production
  # Otherwise, use your existing cloud database (like Neon)
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    restart: always

volumes:
  postgres_data:
  static_volume:
  media_volume: