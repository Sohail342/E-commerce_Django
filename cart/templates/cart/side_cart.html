{% load static %}
{% load custom_filters %}

<div id="side-cart" class="fixed inset-y-0 right-0 w-full max-w-full sm:max-w-xs md:w-96 bg-white shadow-xl transform translate-x-full transition-transform duration-300 ease-in-out z-50 flex flex-col h-[100dvh] backdrop-blur-sm bg-white/95 sm:border-l sm:border-gray-200 sm:rounded-l-xl overflow-hidden">
    <div class="flex items-center justify-between px-4 py-3 sm:py-4 bg-gradient-to-r from-primary-50 to-primary-100 border-b border-gray-200 shadow-sm sticky top-0 z-10 max-sm:px-3 max-sm:py-2.5">
        <h2 class="text-lg font-bold text-gray-900 flex items-center">
            <div class="relative mr-3">
                <svg class="h-6 w-6 text-primary-600 transform transition-transform group-hover:rotate-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                </svg>
                <span class="absolute -top-1 -right-1 flex h-4 w-4">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-4 w-4 bg-primary-500"></span>
                </span>
            </div>
            <span class="font-semibold tracking-tight">Your Shopping Cart</span>
            <span id="side-cart-count" class="ml-2 font-semibold text-gray-800 hover:text-primary-600 px-3 py-2 text-sm font-medium transition-all duration-200 relative group">0</span>
        </h2>
        <button id="close-side-cart" class="p-2 sm:p-1.5 rounded-full text-gray-500 hover:text-gray-700 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 transition-all duration-200 transform sm:active:scale-95 mobile-touch-feedback active:scale-95">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
    </div>
    
    <div id="side-cart-items" class="flex-1 overflow-y-auto px-3 py-2 sm:p-4 space-y-2.5 sm:space-y-4 scrollbar-thin scrollbar-thumb-gray-300 scrollbar-track-gray-100 overscroll-contain touch-pan-y -webkit-overflow-scrolling-touch scroll-p-4 max-sm:px-2 max-sm:py-1">
        <!-- Cart items will be dynamically inserted here -->
        <div class="text-center py-12 px-4 text-gray-500 flex flex-col items-center justify-center h-full" id="empty-cart-message">
            <div class="relative mb-4 group">
                <svg class="mx-auto h-16 w-16 text-gray-400 transition-all duration-300 transform group-hover:scale-110 group-hover:text-primary-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                </svg>
                <svg class="absolute top-0 left-1/2 -ml-8 h-16 w-16 text-primary-500 opacity-0 transition-opacity duration-300 group-hover:opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                </svg>
            </div>
            <p class="text-lg font-medium text-gray-600 mb-2">Your cart is empty</p>
            <p class="text-sm text-gray-500 max-w-xs">Looks like you haven't added any products to your cart yet.</p>
            <a href="{% url 'shop:shop' %}" class="mt-6 inline-flex items-center px-4 py-3 text-sm font-medium text-primary-600 bg-primary-50 rounded-md hover:bg-primary-100 transition-colors duration-200 mobile-touch-feedback active:scale-95 max-sm:w-full max-sm:justify-center max-sm:py-3.5">
                <svg class="mr-2 h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Continue Shopping
            </a>
        </div>
        
        <!-- Template for cart items -->
        <template id="cart-item-template">
            <script>
                function updateSelectedItems() {
                    const cartItems = document.querySelectorAll('.cart-item');
                    cartItems.forEach(item => {
                        const productId = item.dataset.productId;
                        const checkbox = item.querySelector('input[type="checkbox"]');
                        const selected = checkbox.checked;
                        
                        fetch(`/cart/update_selection/${productId}/`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                            },
                            body: JSON.stringify({
                                selected: selected,
                                quantity: parseInt(item.querySelector('input[type="number"]').value)
                            })
                        })
                        .then(response => response.json())
                        .then(data => {
                            if (data.success) {
                                item.classList.toggle('selected', selected);
                            }
                        })
                        .catch(error => console.error('Error:', error));
                    });
                }
            </script>
            <div class="cart-item flex items-start gap-3 p-3 bg-white rounded-lg shadow-sm hover:shadow-md transition-all duration-300" data-product-id="">
                {% if user.is_authenticated %}
                <div class="flex-shrink-0 rounded mt-4 flex items-center justify-center">
                    <label class="custom-checkbox">
                        <input type="checkbox" class="rounded border-2 border-gray-300 transition-colors duration-200"
                               type="checkbox"
                               id="select-item-{{ item.product.id }}"
                               {% if item.selected %}checked{% endif %}
                               data-selected="{{ item.selected|lower }}"
                               @change="updateSelectedItems()"
                               x-data="{ quantity: {{ item.quantity }} }">
                        <div class="checkbox-indicator">
                        </div>
                    </label>
                </div>
                {% endif %}
                <div class="flex-shrink-0 w-16 h-16 bg-gray-100 rounded-lg overflow-hidden">
                    <img src="" alt="" class="w-full h-full object-cover">
                </div>
                <div class="flex-grow min-w-0">
                    <h3 class="text-sm font-medium text-gray-900 truncate product-name"></h3>
                    <div class="mt-1 flex items-center gap-2">
                        <span class="text-sm font-bold text-primary-600 product-price"></span>
                        <span class="text-xs text-gray-500 line-through original-price hidden"></span>
                        <span class="text-xs font-medium text-green-600 bg-green-50 px-1.5 py-0.5 rounded-full sale-badge hidden"></span>
                    </div>
                    <div class="mt-2 flex items-center gap-2">
                        <div class="flex items-center border-2 border-gray-200 rounded-lg max-w-[120px]">
                            <button class="p-1.5 text-gray-600 hover:text-primary-600 quantity-decrease">
                                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M20 12H4"/>
                                </svg>
                            </button>
                            <input type="number" class="w-12 border-0 text-center focus:ring-0 text-sm quantity-input" min="1">
                            <button class="p-1.5 text-gray-600 hover:text-primary-600 quantity-increase">
                                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
                                </svg>
                            </button>
                        </div>
                        <button class="text-sm text-red-600 hover:text-red-700 remove-item">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </template>
    </div>
    
    <div class="border-t border-gray-200 p-3 sm:p-5 space-y-2.5 sm:space-y-4 bg-gradient-to-b from-white to-gray-50 shadow-inner sticky bottom-0 z-10 max-sm:pb-[calc(env(safe-area-inset-bottom)+0.75rem)] max-sm:p-2.5 max-sm:space-y-2">
        <div class="flex justify-between items-center">
            <p class="text-base font-medium text-gray-500">Subtotal</p>
            <p id="side-cart-subtotal" class="text-xl font-bold text-gray-900 transition-all duration-300 ease-in-out">PKR 0.00</p>
        </div>
        <div class="space-y-2 sm:space-y-3 mt-3 sm:mt-4">
            <a href="{% url 'cart:cart' %}" class="w-full flex justify-center items-center px-4 sm:px-6 py-2.5 sm:py-3 border border-transparent rounded-lg shadow-md text-sm sm:text-base font-medium text-white bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 hover:scale-[1.02] hover:shadow-lg sm:active:scale-[0.98] group mobile-touch-feedback active:scale-95 max-sm:py-3.5 max-sm:text-base">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 sm:h-5 w-4 sm:w-5 mr-1.5 sm:mr-2 group-hover:animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                </svg>
                View Cart
            </a>
            <a href="{% url 'order:checkout' %}" class="w-full flex justify-center items-center px-4 sm:px-6 py-2.5 sm:py-3 border border-transparent rounded-lg shadow-md text-sm sm:text-base font-medium text-white bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 transition-all duration-300 transform hover:scale-[1.02] hover:shadow-lg sm:active:scale-[0.98] group mobile-touch-feedback active:scale-95 max-sm:py-3.5 max-sm:text-base">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 sm:h-5 w-4 sm:w-5 mr-1.5 sm:mr-2 group-hover:translate-x-1 transition-transform duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3" />
                </svg>
                Checkout Now
            </a>
        </div>
        <div class="flex justify-center pt-1">
            <button id="continue-shopping" class="text-sm font-medium text-primary-600 hover:text-primary-800 transition-colors duration-200 flex items-center py-2 group mobile-touch-feedback active:scale-95 max-sm:py-3 max-sm:px-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1 transform group-hover:-translate-x-1 transition-transform duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Continue Shopping
            </button>
        </div>
    </div>
</div>

<div id="side-cart-overlay" class="fixed inset-0 bg-black bg-opacity-50 backdrop-blur-sm z-40 hidden transition-all duration-300 ease-in-out opacity-0 sm:backdrop-blur-[2px] md:backdrop-blur-[3px] max-sm:backdrop-blur-[4px] max-sm:bg-opacity-40 max-sm:transition-opacity max-sm:duration-200"></div>

<!-- Include mobile-specific JavaScript -->
<script src="{% static 'js/side-cart-mobile.js' %}"></script>
<script src="{% static 'js/side-cart-interactions.js' %}"></script>
<script src="{% static 'js/side-cart-subtotal.js' %}"></script>
